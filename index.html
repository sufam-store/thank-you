body{font-family:'Tajawal',system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;line-height:1.7;direction:rtl;text-align:right;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}

.copy-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#ea580c;color:#fff;border-radius:999px;padding:11px 22px;font-weight:800;font-size:13px;transition:all .25s ease;min-height:44px}

.track-inp{flex:1;min-width:150px;padding:12px 14px;border:2px solid #e2e8f0;border-radius:11px;background:#fff;font-family:inherit;font-size:14px;font-weight:700;outline:none;direction:ltr;text-align:center;transition:border-color .2s}
.track-inp:focus{border-color:#ea580c;box-shadow:0 0 0 4px rgba(234,88,12,.1)}
.track-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;background:linear-gradient(135deg,#ea580c,#c2410c);color:#fff;border-radius:11px;font-weight:900;font-size:14px;min-height:48px;transition:transform .2s}
.track-btn:hover{transform:translateY(-2px)}
.track-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.track-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.track-res{margin-top:14px;padding:14px;background:#fff;border-radius:11px;border-right:4px solid #ea580c;display:none;font-size:14px}
.track-res.show{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.track-row{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px dashed #e2e8f0}
.track-row:last-of-type{border-bottom:0}

.empty-state{text-align:center;padding:40px 20px}
.empty-icon{width:80px;height:80px;border-radius:50%;background:#fee2e2;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.empty-icon svg{width:40px;height:40px;fill:none;stroke:#dc2626;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.empty-state h1{font-size:22px;margin-bottom:12px}
.empty-state p{color:#64748b;margin:0 0 24px}
.empty-cta{display:inline-flex;align-items:center;gap:.8px;background:#ea580c;color:#fff;8padding:14px 28px;border-radius:12-.px;font-weight:900;font-size:15px1;transition:transform .25s}
.empty-cta:hover-.{transform:translateY(-2px)}

}
</style>

<script>
window.SUFAM_CONFIG = {

<script>
(function(){
'use strict';
var C = window.SUFAM_CONFIG;
var hasGA = C.GA4_ID && C.GA4_ID !== 'G-XXXXXXXXXX';
var hasFB = C.FB_PIXEL_ID && C.FB_PIXEL_ID !== 'YOUR_PIXEL_ID';

/* ═══ Analytics ═══ */
if(hasGA){
  var g=document.createElement('script');
  g.async=true;g.src='https://www.googletagmanager.com/gtag/js?id='+C.GA4_ID;
  document.head.appendChild(g);
  window.dataLayer=window.dataLayer||[];
  window.gtag=function(){window.dataLayer.push(arguments)};
  gtag('js',new Date());
  gtag('config',C.GA4_ID,{send_page_view:true});
}
if(hasFB){
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init',C.FB_PIXEL_ID);
  fbq('track','PageView');
}

/* ═══ Helpers ═══ */
function readCookie(n){
  try{
    var m = document.cookie.match('(^|;)\\s*'+n+'\\s*=\\s*([^;]+)');
    return m ? decodeURIComponent(m[2]) : '';
  }catch(e){return '';}
}
function deleteCookie(n){
  try{
    var domains = [C.COOKIE_DOMAIN, '', '.sufam.ma', 'ty.sufam.ma'];
    domains.forEach(function(d){
      var base = n+'=;max-age=0;path=/';
      document.cookie = d ? base+';domain='+d : base;
    });
  }catch(e){}
}
function eh(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmt(n){
  if(!n) return '0';
  return (Math.round(n*100)/100).toLocaleString('ar-MA');
}

/* ═══ Read Order Data (cookie → localStorage → sessionStorage) ═══ */
var raw = '';
try{ raw = readCookie('sufam_order'); }catch(e){}
if(!raw){
  try{ raw = localStorage.getItem('sufam_order') || ''; }catch(e){}
}
if(!raw){
  try{ raw = sessionStorage.getItem('sufam_order') || ''; }catch(e){}
}

var data = {};
try{ data = raw ? JSON.parse(raw) : {}; }catch(e){}

var ref     = data.ref || 'SF-XXXX';
var product = data.product || '';
var price   = parseFloat(data.price) || 0;
var qty     = parseInt(data.qty,10) || 1;
var name    = data.name || '';
var city    = data.city || '';
var phone   = data.phone || '';
var total   = Math.round(price * qty * 100) / 100;

/* امسح البيانات بعد القراءة */
deleteCookie('sufam_order');
try{ localStorage.removeItem('sufam_order'); }catch(e){}
try{ sessionStorage.removeItem('sufam_order'); }catch(e){}

/* ═══ Empty State ═══ */
if(!data.ref){
  document.getElementById('mainContent').innerHTML = 
    '<div class="empty-state">'
    + '<div class="empty-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg></div>'
    + '<h1>لا توجد بيانات طلب</h1>'
    + '<p>يبدو أنك فتحت هذه الصفحة مباشرة.<br>الرجاء إتمام طلب من المتجر أولاً.</p>'
    + '<a class="empty-cta" href="'+C.STORE_URL+'"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>العودة للمتجر</a>'
    + '</div>';
  document.getElementById('year').textContent = new Date().getFullYear();
  return;
}

/* ═══ Render ═══ */
document.getElementById('refNum').textContent = '#'+ref;
document.getElementById('trackInp').value = ref;
document.getElementById('waBtn').href = 'https://wa.me/'+C.WHATSAPP+'?text='+encodeURIComponent('مرحباً، طلبي رقم '+ref);

var details = document.getElementById('details');
var ICONS = {
  product:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  city:'<path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/>',
  qty:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>',
  money:'<circle cx="12" cy="12" r="9"/><path d="M14 8h-3a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4h-3"/><path d="M12 6v12"/>'
};
var rows = [];
if(product) rows.push({ic:ICONS.product, lb:'المنتج', vl:product});
if(name)    rows.push({ic:ICONS.user,    lb:'الاسم',  vl:name});
if(phone)   rows.push({ic:ICONS.phone,   lb:'الهاتف', vl:phone, dir:'ltr'});
if(city)    rows.push({ic:ICONS.city,    lb:'المدينة',vl:city});
rows.push({ic:ICONS.qty, lb:'الكمية', vl:String(qty)});

var html='';
rows.forEach(function(r){
  html += '<div class="row"><span class="lbl"><svg viewBox="0 0 24 24">'+r.ic+'</svg>'+r.lb+'</span><span class="val" style="direction:'+(r.dir||'rtl')+';">'+eh(r.vl)+'</span></div>';
});
if(total>0){
  html += '<div class="row total"><span class="lbl"><svg viewBox="0 0 24 24">'+ICONS.money+'</svg>المجموع</span><span class="val">'+fmt(total)+' MAD</span></div>';
}
details.innerHTML = html;

/* ═══ Copy Ref ═══ */
var copyBtn=document.getElementById('copyBtn');
var copyTxt=document.getElementById('copyTxt');
var copyIcon=document.getElementById('copyIcon');
function fallbackCopy(txt,cb){
  var t=document.createElement('textarea');
  t.value=txt;t.style.position='fixed';t.style.opacity='0';
  document.body.appendChild(t);t.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(t);cb();
}
copyBtn.addEventListener('click',function(){
  var done=function(){
    copyTxt.textContent='تم النسخ ✓';
    copyBtn.classList.add('done');
    copyIcon.innerHTML='<polyline points="20 6 9 17 4 12"/>';
    setTimeout(function(){
      copyTxt.textContent='نسخ الرقم';
      copyBtn.classList.remove('done');
      copyIcon.innerHTML='<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
    },2000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ref).then(done).catch(function(){fallbackCopy(ref,done)});
  }else{
    fallbackCopy(ref,done);
  }
});

/* ═══ Track Order ═══ */
var trackBtn=document.getElementById('trackBtn');
var trackInp=document.getElementById('trackInp');
var trackRes=document.getElementById('trackRes');
function showTrack(h){
  trackRes.innerHTML=h;
  trackRes.classList.add('show');
}
trackBtn.addEventListener('click',function(){
  var r=(trackInp.value||'').trim().replace(/^#/,'');
  if(!r){showTrack('<p style="text-align:center;color:#dc2626;margin:0;">الرجاء إدخال رقم المرجع</p>');return;}
  showTrack('<p style="text-align:center;color:#64748b;margin:0;">جاري البحث...</p>');
  trackBtn.disabled=true;
  fetch(C.API_BASE+'/api/order?ref='+encodeURIComponent(r))
    .then(function(x){return x.json()})
    .then(function(res){
      trackBtn.disabled=false;
      if(res.status==='not_found'||!res.order){
        showTrack('<p style="text-align:center;color:#dc2626;margin:0;">❌ لم يتم العثور على الطلب</p>');
        return;
      }
      var o=res.order;
      var colors={'جديد':'#fef3c7','تم التأكيد':'#dbeafe','تم الشحن':'#e0e7ff','تم التسليم':'#d1fae5','ملغى':'#fee2e2'};
      var bg='#fef3c7';
      for(var k in colors){if(o.status && o.status.indexOf(k)!==-1){bg=colors[k];break;}}
      var data=[['المرجع',o.ref||r,'ltr'],['المنتج',o.product||'-','rtl'],['الاسم',o.name||'-','rtl'],['المدينة',o.city||'-','rtl'],['الكمية',o.qty||'-','rtl'],['المجموع',o.total||'-','rtl']];
      var h='';
      data.forEach(function(rw){
        h+='<div class="track-row"><span class="tl">'+rw[0]+':</span><strong class="tv" style="direction:'+rw[2]+';">'+eh(rw[1])+'</strong></div>';
      });
      h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px 4px;"><span class="tl">الحالة:</span><span class="status-chip" style="background:'+bg+';">'+eh(o.status||'-')+'</span></div>';
      showTrack(h);
    })
    .catch(function(){
      trackBtn.disabled=false;
      showTrack('<p style="text-align:center;color:#dc2626;margin:0;">❌ تعذر الاتصال</p>');
    });
});
trackInp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();trackBtn.click();}});

/* ═══ Purchase Tracking (once per order) ═══ */
if(ref && ref!=='SF-XXXX'){
  var fk='pf_'+ref, done=false;
  
  /* نستعمل localStorage (أفضل من sessionStorage على iOS) */
  try{ done=!!localStorage.getItem(fk); }catch(e){}
  if(!done){
    try{ localStorage.setItem(fk,'1'); }catch(e){}
    
    /* تأخير باش نضمنو أن fbq و gtag محملين */
    setTimeout(function(){
      if(hasFB && typeof fbq==='function'){
        try{
          fbq('track','Purchase',{
            value:total,
            currency:C.CURRENCY,
            content_ids:[ref],
            content_name:product||'',
            content_type:'product',
            num_items:qty
          });
          console.log('✅ FB Purchase sent:', ref, total);
        }catch(e){ console.error('FB Purchase error:', e); }
      }
      if(hasGA && typeof gtag==='function'){
        try{
          gtag('event','purchase',{
            transaction_id:ref,
            value:total,
            currency:C.CURRENCY,
            items:[{item_id:ref,item_name:product||'',price:price,quantity:qty}]
          });
          console.log('✅ GA Purchase sent:', ref, total);
        }catch(e){ console.error('GA Purchase error:', e); }
      }
    },800);
  }
}

/* ═══ Year ═══ */
document.getElementById('year').textContent=new Date().getFullYear();

})();
</script>
